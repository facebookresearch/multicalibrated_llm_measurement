name: Compile Paper

on:
  push:
    branches: [main]
    paths: ['paper/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache APT packages
        uses: awalber/cache-apt-pkgs-action@latest
        with:
          packages: pandoc texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Compile PDF
        working-directory: paper
        run: pandoc paper.md -o paper.pdf --citeproc

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet paper/paper.pdf || (git add paper/paper.pdf && git commit -m "Recompile paper.pdf" && git push)
